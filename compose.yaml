
services:
  backend:
    build: ./backend
    container_name: gymfit-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      CLIENT_URL: http://localhost:8080

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:5000
    container_name: gymfit-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
